services:
  flow-cutter:
    build: .
    container_name: flow-cutter
    restart: unless-stopped

    # Le port 80 du conteneur est publie sur le port 8090 de l'hote.
    # Nginx Proxy Manager pointe dessus : Scheme "http" (surtout pas https,
    # nginx ne fait pas de TLS ici), Forward Hostname 192.168.1.37,
    # Forward Port 8090.
    ports:
      - "8090:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # L'app est 100% statique : nginx n'a besoin d'ecrire nulle part de facon
    # persistante, on peut donc durcir le conteneur sans rien casser.
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    # Alternative plus propre : si Nginx Proxy Manager tourne sur le meme hote
    # Docker, mettez les deux conteneurs sur un reseau commun, supprimez le bloc
    # "ports:" ci-dessus, et pointez NPM sur Hostname "flow-cutter" / Port 80.
    # L'app n'est alors plus exposee sur le reseau local, uniquement via le proxy.
    # networks:
    #   - reverse-proxy

# networks:
#   reverse-proxy:
#     external: true
