server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # index.html et manifest.json : revalidation obligatoire a chaque chargement.
    #
    # Sans cela, Safari (et bien plus encore une application ajoutee a l'ecran d'accueil,
    # qui possede son propre cache) continue de servir l'ancienne version apres un
    # deploiement, parfois pendant des jours. Comme toute l'application tient dans
    # index.html, une seule reponse perimee suffit a annuler entierement une mise a jour.
    # "no-cache" n'interdit pas la mise en cache : il impose seulement de verifier aupres
    # du serveur avant de reutiliser. Une version inchangee repond 304, donc le cout reseau
    # reste negligeable.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Polices et icones : contenu stable, jamais modifie sans changement de nom.
    location ~* \.(otf|ttf|woff2?|png|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
